<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理菜单 | 家宴</title><link rel="stylesheet" href="/style.css"></head><body class="admin-page">
<header><a class="brand" href="/">家宴 <span>MAISON</span></a><nav><a class="nav-manage" href="/">返回菜单 ↗</a></nav></header>
<main class="admin">
<div class="admin-toolbar"><div><p class="eyebrow">THE COLLECTION</p><h2>已添加的菜品 <span id="manageCount">0</span></h2></div><button id="addDish" class="admin-add" type="button">＋ 添加菜品</button></div>
<p id="message" role="status" aria-live="polite"></p><section class="admin-panel"><div class="divider"><span>菜品列表</span><span>拖动调整顺序</span></div><div id="list"></div><p id="listEmpty" class="hint">还没有菜品，先添加第一道吧。</p></section></main>
<dialog id="dishDialog" aria-labelledby="formTitle"><form id="form"><div class="dialog-top"><div><p class="eyebrow">YOUR COLLECTION</p><h2 id="formTitle">添加菜品</h2></div><button type="button" id="closeDialog" class="close" aria-label="关闭">×</button></div><p class="hint">记录每一道值得分享的味道。</p><label>菜品名称<input name="name" maxlength="80" required placeholder="例如：红烧肉"></label><label>菜品照片 <span class="optional">JPG / PNG / WEBP / GIF · 最大 10 MB</span><img id="photoPreview" class="photo-preview" alt="当前菜品照片" hidden><input name="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><p id="photoHint" class="hint">添加菜品时请选择照片。</p><label>材料 <span class="optional">可选，使用顿号分隔</span><input name="ingredients_text" placeholder="例如：牛肉、土豆、洋葱"></label><input type="hidden" name="ingredients_present" value="1"><label>菜品做法 <span class="optional">可选</span><textarea name="recipe" rows="6" placeholder="写下食材、步骤或复刻时的小提示"></textarea></label><p id="formMessage" role="alert"></p><div class="actions"><button type="button" id="cancelEdit">取消</button><button type="submit" class="primary" id="save">添加菜品 ↗</button></div></form></dialog>
<script src="/admin.js"></script></body></html>
