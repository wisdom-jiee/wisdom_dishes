<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理菜单 | 家宴</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a class="brand" href="/">家宴 <span>MAISON</span></a><nav><a class="nav-manage" href="/">返回菜单 ↗</a></nav></header>
<main class="admin"><div class="admin-heading"><p class="eyebrow">YOUR COLLECTION / 菜品管理</p><h1>管理菜单</h1><p>记录每一道值得分享的味道。</p></div><div class="admin-layout"><section class="admin-panel"><h2 id="formTitle">添加菜品</h2><form id="form"><label>菜品名称<input name="name" maxlength="80" required placeholder="例如：红烧肉"></label><label>菜品照片 <span class="optional">JPG / PNG / WEBP / GIF · 最大 10 MB</span><input name="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><p id="photoHint" class="hint">添加菜品时请选择照片。</p><p id="message" role="status"></p><div class="actions"><button type="button" id="cancelEdit" hidden>取消编辑</button><button type="submit" class="primary" id="save">添加菜品 ↗</button></div></form></section><section class="admin-panel"><div class="divider"><span>已添加的菜品</span><span id="manageCount">0</span></div><div id="list"></div><p id="listEmpty" class="hint">还没有菜品，先添加第一道吧。</p></section></div></main><script src="/admin.js"></script></body></html>
